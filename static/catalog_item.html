<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Katalog</title>
        <script>
            const productState = '{state}';
            const catalogType = '{catalog_type}';
        </script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-white pt-2 pb-16 px-[4vw] sm:px-[6vw] md:px-[8vw] lg:px-[10vw] xl:px-[12vw] 2xl:px-[14vw] flex flex-col">
        <div class="flex flex-col gap-4 mb-4 sm:mb-8 sm:flex-row-reverse sm:justify-between sm:items-center">
            <img class="w-full sm:self-start sm:w-[50%] md:w-[40%] lg:w-[30%] xl:w-[20%] 2xl:w-[10%] sm:origin-top-right sm:hover:scale-[200%] aspect-16/9 object-cover rounded-md sm:transition sm:transition-all sm:duration-[.250s] sm:ease-out" style="object-position: top;" src="{image}" alt="Item Image">
            <div class="flex flex-row items-center justify-between gap-4 sm:flex-col sm:items-start">
                <h1 class="text-2xl font-semibold text-gray-950">{name}</h1>
                <button data-book-api="{book_api}" id="book-button" class="py-2 px-3 leading-none self-end sm:self-start text-white font-medium bg-green-700 hover:bg-green-900 rounded-sm cursor-pointer focus:outline-2 focus:outline-offset-2 focus:outline-green-700 active:bg-green-900">Book Now</button>
            </div>
        </div>
        <div class="flex flex-col justify-between sm:flex-row gap-2">
            <div class="sm:w-[50%] flex flex-col gap-2">
                <p class="text-md text-gray-950">Price: Rp{purchase_price_formatted}</p>
                <p class="text-md text-gray-950">Reference: {reference}</p>
                <p class="text-md text-gray-950">Weight: {weight_formatted}kg</p>
                <p class="text-md text-gray-950">Age: {age_rounded} months</p>
                <p class="text-md text-gray-950">Origin: {origin}</p>
            </div>
            <div class="sm:w-[50%] flex flex-col gap-2">
                <p class="text-md text-gray-950">Group: {kelompok}</p>
                <p class="text-md text-gray-950">Type: {type_id.name}</p>
                <p class="text-md text-gray-950">Jatah: {jatah}</p>
                <p class="text-md text-gray-950">Last inspection: {last_inspection_date}</p>
            </div>
        </div>
        <h2 class="text-xl font-semibold text-gray-950 mb-2 mt-8">Images</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:6 gap-4">{images}</div>
        <div id="book-form" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center">
            <div class="bg-white w-[90%] sm:w-[400px] rounded-lg shadow-lg p-6 flex flex-col gap-4">
                <h3 class="text-xl font-semibold text-gray-900 mb-2">Booking Information</h3>
                <form class="flex flex-col gap-3">
                    <input id="book-form-customer-name" type="text" placeholder="Full Name *" class="border border-gray-300 rounded-md px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-700" required>
                    <input id="book-form-customer-number" type="tel" placeholder="Phone Number" class="border border-gray-300 rounded-md px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-700">
                    <input id="book-form-customer-email" type="email" placeholder="Email Address" class="border border-gray-300 rounded-md px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-700">
                    <textarea id="book-form-customer-address" placeholder="Full Address" rows="3" class="border border-gray-300 rounded-md px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-700 resize-none"></textarea>
                    <div class="flex justify-end gap-2 mt-4">
                        <button type="button" id="cancel-button" onclick="hideBookForm();" class="px-4 py-2 rounded-md bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium">Cancel</button>
                        <button type="submit" id="submit-button" onclick="submitBookForm(event);" class="px-4 py-2 rounded-md bg-green-700 hover:bg-green-800 text-white font-medium">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <script src="{STATIC_ROUTE_PREFIX}/catalog_item.js"></script>
    </body>
</html>
