<div class="w-full rounded-sm overflow-hidden shadow-xl bg-white">
    <img class="w-full aspect-16/9 object-cover" src="{image}">
    <div class="p-4">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">{name}</h2>
        <div class="flex flex-row justify-between">
            <div>
                <p class="text-gray-600 text-sm">Weight: {weight}kg</p>
                <p class="text-gray-600 text-sm">Price: Rp{purchase_price}</p>
            </div>
            <button class="py-2 px-3 leading-none self-end text-white font-medium bg-green-700 hover:bg-green-900 rounded-sm cursor-pointer">Book</button>
        </div>
    </div>
</div>
