<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Katalog</title>
        <script>const filters = {filters}; let productStates = Object();</script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-white p-2 pb-16">
        <header class="col-span-full mb-4">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-gray-700 font-medium">Filter by:</span>
                <div class="relative flex-1">
                    <button id="filterButton" class="w-full flex justify-between items-center shadow-2xs bg-gray-200 hover:bg-gray-300 rounded-xl p-3 transition-colors">
                        <span id="selectedFilter" class="text-gray-700">Pilih Filter</span>
                        <svg class="w-5 h-5 text-gray-600 transition-transform" id="dropdownIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="dropdownMenu" class="hidden absolute top-full left-0 right-0 mt-2 bg-white shadow-2xs rounded-xl border border-gray-200 z-10 max-h-60 overflow-y-auto">
                        <div id="filterOptions" class="py-2">
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">
            <!-- Products akan di-generate dari Kinan -->
             {cards}
        </div>
    </body>
    <script src="{STATIC_ROUTE_PREFIX}/catalog.js"></script>
</html>
